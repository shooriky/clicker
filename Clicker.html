<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Super Clicker</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #2b5876, #4e4376);
      color: #f5f5f5;
    }

    .game {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
      max-width: 900px;
      width: 100%;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
    }

    .left, .right {
      padding: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 0.04em;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
    }

    .subtitle {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 16px;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    .stat-label {
      opacity: 0.8;
    }

    .stat-value {
      font-weight: 600;
    }

    .big-button-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0 18px;
    }

    .big-button {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: none;
      background: radial-gradient(circle at 30% 30%, #ffdf7e, #ff9f43);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.2),
        0 18px 40px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .big-button:active {
      transform: scale(0.95) translateY(2px);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.15),
        0 10px 24px rgba(0, 0, 0, 0.7);
    }

    .big-button-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: #5a2c00;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4);
      pointer-events: none;
    }

    .floating-text {
      position: absolute;
      color: #fff;
      font-weight: 700;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      animation: floatUp 0.7s ease-out forwards;
      font-size: 16px;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-40px);
      }
    }

    .log {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      max-height: 120px;
      overflow-y: auto;
    }

    .log-entry {
      opacity: 0.9;
      margin-bottom: 4px;
    }

    .log-entry span.time {
      opacity: 0.6;
      margin-right: 4px;
    }

    .upgrades-title {
      font-size: 18px;
      margin: 0 0 10px;
    }

    .upgrades {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
    }

    .upgrade {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border: 1px solid transparent;
      transition: border 0.15s ease, background 0.15s ease, transform 0.08s ease;
    }

    .upgrade.affordable {
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.45);
    }

    .upgrade:hover {
      transform: translateY(-1px);
    }

    .upgrade-info {
      font-size: 13px;
    }

    .upgrade-name {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .upgrade-desc {
      opacity: 0.8;
      margin-bottom: 2px;
    }

    .upgrade-meta {
      font-size: 12px;
      opacity: 0.9;
    }

    .upgrade button {
      border-radius: 999px;
      border: none;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
      white-space: nowrap;
    }

    .upgrade button:disabled {
      cursor: default;
      filter: grayscale(0.7);
      box-shadow: none;
      opacity: 0.7;
    }

    .upgrade button:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .footer {
      margin-top: 10px;
      font-size: 11px;
      opacity: 0.7;
      text-align: right;
    }

    @media (max-width: 720px) {
      .game {
        grid-template-columns: 1fr;
      }

      .big-button {
        width: 170px;
        height: 170px;
      }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="left">
      <h1>Super Clicker</h1>
      <div class="subtitle">Click, upgrade, and watch the numbers explode.</div>

      <div class="stats">
        <div>
          <span class="stat-label">Coins:</span>
          <span class="stat-value" id="coins">0</span>
        </div>
        <div>
          <span class="stat-label">Per Click:</span>
          <span class="stat-value" id="perClick">1</span>
        </div>
        <div>
          <span class="stat-label">Per Second:</span>
          <span class="stat-value" id="perSecond">0</span>
        </div>
        <div>
          <span class="stat-label">Total Clicks:</span>
          <span class="stat-value" id="totalClicks">0</span>
        </div>
      </div>

      <div class="big-button-wrapper">
        <button class="big-button" id="clickButton">
          <div class="big-button-label">CLICK</div>
        </button>
      </div>

      <div class="log" id="log"></div>
      <div class="footer">Tip: Upgrades stack—mix click power with passive income for maximum chaos.</div>
    </div>

    <div class="right">
      <div class="upgrades-title">Upgrades</div>
      <div class="upgrades" id="upgrades"></div>
    </div>
  </div>

  <script>
    // --- Core state ---
    let coins = 0;
    let perClick = 1;
    let perSecond = 0;
    let totalClicks = 0;

    // --- DOM references ---
    const coinsEl = document.getElementById("coins");
    const perClickEl = document.getElementById("perClick");
    const perSecondEl = document.getElementById("perSecond");
    const totalClicksEl = document.getElementById("totalClicks");
    const clickButton = document.getElementById("clickButton");
    const logEl = document.getElementById("log");
    const upgradesEl = document.getElementById("upgrades");

    // --- Simple sound using Web Audio API ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playClickSound(pitch = 440) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "square";
      osc.frequency.value = pitch;

      gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.13);
    }

    function playUpgradeSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(660, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.18);

      gain.gain.setValueAtTime(0.16, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
    }

    // --- Floating text on click ---
    function spawnFloatingText(text, x, y) {
      const rect = clickButton.getBoundingClientRect();
      const span = document.createElement("span");
      span.className = "floating-text";
      span.textContent = text;

      const offsetX = x - rect.left;
      const offsetY = y - rect.top;

      span.style.left = offsetX + "px";
      span.style.top = offsetY + "px";

      clickButton.appendChild(span);
      setTimeout(() => span.remove(), 700);
    }

    // --- Log ---
    function addLog(message) {
      const entry = document.createElement("div");
      entry.className = "log-entry";

      const time = new Date();
      const timeStr = time.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

      entry.innerHTML = `<span class="time">[${timeStr}]</span>${message}`;
      logEl.prepend(entry);

      const maxEntries = 40;
      while (logEl.children.length > maxEntries) {
        logEl.removeChild(logEl.lastChild);
      }
    }

    // --- Upgrades data ---
    const upgrades = [
      {
        id: "fingerTraining",
        name: "Finger Training",
        desc: "Increase coins per click by 1.",
        baseCost: 15,
        level: 0,
        type: "perClick",
        valuePerLevel: 1,
        costScale: 1.25
      },
      {
        id: "ergonomicMouse",
        name: "Ergonomic Mouse",
        desc: "Increase coins per click by 3.",
        baseCost: 80,
        level: 0,
        type: "perClick",
        valuePerLevel: 3,
        costScale: 1.3
      },
      {
        id: "autoClicker",
        name: "Auto Clicker",
        desc: "Generates 1 coin per second.",
        baseCost: 50,
        level: 0,
        type: "perSecond",
        valuePerLevel: 1,
        costScale: 1.25
      },
      {
        id: "assistantBot",
        name: "Assistant Bot",
        desc: "Generates 5 coins per second.",
        baseCost: 250,
        level: 0,
        type: "perSecond",
        valuePerLevel: 5,
        costScale: 1.3
      },
      {
        id: "goldenTouch",
        name: "Golden Touch",
        desc: "Multiply coins per click by 2.",
        baseCost: 500,
        level: 0,
        type: "multiplierClick",
        valuePerLevel: 2,
        costScale: 2.2
      },
      {
        id: "timeWarp",
        name: "Time Warp",
        desc: "Multiply coins per second by 2.",
        baseCost: 800,
        level: 0,
        type: "multiplierSecond",
        valuePerLevel: 2,
        costScale: 2.2
      }
    ];

    function getUpgradeCost(upgrade) {
      return Math.floor(upgrade.baseCost * Math.pow(upgrade.costScale, upgrade.level));
    }

    function renderUpgrades() {
      upgradesEl.innerHTML = "";
      upgrades.forEach(upg => {
        const cost = getUpgradeCost(upg);
        const affordable = coins >= cost;

        const div = document.createElement("div");
        div.className = "upgrade" + (affordable ? " affordable" : "");

        const info = document.createElement("div");
        info.className = "upgrade-info";

        const name = document.createElement("div");
        name.className = "upgrade-name";
        name.textContent = upg.name;

        const desc = document.createElement("div");
        desc.className = "upgrade-desc";
        desc.textContent = upg.desc;

        const meta = document.createElement("div");
        meta.className = "upgrade-meta";
        meta.textContent = `Cost: ${cost} | Level: ${upg.level}`;

        info.appendChild(name);
        info.appendChild(desc);
        info.appendChild(meta);

        const btn = document.createElement("button");
        btn.textContent = "Buy";
        btn.disabled = !affordable;

        btn.addEventListener("click", () => {
          buyUpgrade(upg.id);
        });

        div.appendChild(info);
        div.appendChild(btn);
        upgradesEl.appendChild(div);
      });
    }

    function buyUpgrade(id) {
      const upg = upgrades.find(u => u.id === id);
      if (!upg) return;

      const cost = getUpgradeCost(upg);
      if (coins < cost) return;

      coins -= cost;
      upg.level++;

      switch (upg.type) {
        case "perClick":
          perClick += upg.valuePerLevel;
          addLog(`You upgraded <b>${upg.name}</b>! +${upg.valuePerLevel} coins per click.`);
          break;
        case "perSecond":
          perSecond += upg.valuePerLevel;
          addLog(`You upgraded <b>${upg.name}</b>! +${upg.valuePerLevel} coins per second.`);
          break;
        case "multiplierClick":
          perClick *= upg.valuePerLevel;
          addLog(`You activated <b>${upg.name}</b>! Coins per click multiplied by ${upg.valuePerLevel}.`);
          break;
        case "multiplierSecond":
          perSecond *= upg.valuePerLevel;
          addLog(`You activated <b>${upg.name}</b>! Coins per second multiplied by ${upg.valuePerLevel}.`);
          break;
      }

      playUpgradeSound();
      updateStats();
      renderUpgrades();
    }

    // --- Stats update ---
    function updateStats() {
      coinsEl.textContent = Math.floor(coins);
      perClickEl.textContent = perClick;
      perSecondEl.textContent = perSecond;
      totalClicksEl.textContent = totalClicks;
    }

    // --- Click handling ---
    clickButton.addEventListener("click", (e) => {
      initAudio(); // first user interaction unlocks audio
      const gain = perClick;
      coins += gain;
      totalClicks++;

      const rect = clickButton.getBoundingClientRect();
      const x = e.clientX || (rect.left + rect.width / 2);
      const y = e.clientY || (rect.top + rect.height / 2);

      spawnFloatingText("+" + gain, x, y);
      playClickSound(420 + Math.random() * 80);

      if (totalClicks === 1) {
        addLog("First click! The journey begins.");
      } else if (totalClicks === 50) {
        addLog("50 clicks! Your fingers are warming up.");
      } else if (totalClicks === 200) {
        addLog("200 clicks! You’re officially committed.");
      }

      updateStats();
      renderUpgrades();
    });

    // --- Passive income loop ---
    setInterval(() => {
      if (perSecond > 0) {
        coins += perSecond / 10; // 10 ticks per second
        updateStats();
        renderUpgrades();
      }
    }, 100);

    // --- Initial render ---
    updateStats();
    renderUpgrades();
  </script>
</body>
</html>
